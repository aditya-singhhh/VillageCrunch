# Internal hosting stack: app + MongoDB (+ optional Caddy for HTTPS).
#   cp backend/.env.example backend/.env   # then fill in JWT_SECRET, Razorpay TEST keys, etc.
#   docker compose up -d --build
#   docker compose exec app node scripts/createAdmin.js you@company.com "Your Name" 9XXXXXXXXX
services:
  app:
    build: .
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/villagecrunch
      UPLOAD_DIR: /data/uploads
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
    ports:
      - "${APP_PORT:-8080}:8080"

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
    # Not published to the host: only the app can reach the database.

  # Optional HTTPS reverse proxy (enable with: docker compose --profile proxy up -d)
  caddy:
    image: caddy:2
    profiles: ["proxy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app

volumes:
  uploads:
  mongo-data:
  caddy-data:
