name: Firebase
# Actions > Firebase > Run workflow:
#   bootstrap  = one-time cloud setup (database, bucket, secrets...)   -> run this FIRST
#   deploy     = build + publish the site (also runs automatically on push to main)
#   create-admin = make/promote an admin user (needs ADMIN_EMAIL, ADMIN_PASSWORD secrets)
#   connect-domain = add CUSTOM_DOMAIN (repo variable, default villagecrunch.in) + www to Firebase Hosting
#                    and print the DNS records to add at your domain registrar
# Setup: docs/FIREBASE_AUTOMATED_SETUP.md
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        type: choice
        options: [bootstrap, deploy, bootstrap-and-deploy, create-admin, migrate-dry-run, migrate, seed-products, connect-domain]
        default: bootstrap-and-deploy

concurrency:
  group: firebase
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
  SITE_URL: ${{ vars.SITE_URL }}
  TRUST_PROXY: ${{ vars.TRUST_PROXY || '2' }}

jobs:
  run:
    # Pushes to main only auto-deploy once you set the repository variable AUTO_DEPLOY=true
    # (after the first successful manual bootstrap-and-deploy).
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        env:
          SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          [ -n "$PROJECT_ID" ] || { echo "::error::Set the repository VARIABLE GCP_PROJECT_ID (Variables tab, not Secrets)"; exit 1; }
          [ -n "$SA_KEY" ] || { echo "::error::Set the repository SECRET GCP_SA_KEY"; exit 1; }

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bootstrap cloud resources
        if: github.event_name == 'workflow_dispatch' && contains(inputs.action, 'bootstrap')
        env:
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
        run: ./scripts/bootstrap-firebase.sh

      - name: Run tests
        if: github.event_name == 'push' || contains(inputs.action, 'deploy')
        run: cd backend && npm ci && npm test

      - name: Deploy
        if: github.event_name == 'push' || contains(inputs.action, 'deploy')
        run: |
          set -o pipefail
          ./scripts/deploy-firebase.sh 2>&1 | tee /tmp/deploy.log || {
            # surface the end of the log as an annotation so it is readable without opening the log
            tail -n 25 /tmp/deploy.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > /tmp/tail.txt
            echo "::error title=Deploy failed::$(cat /tmp/tail.txt)"
            exit 1
          }

      - name: Migrate data from MongoDB (dry run checks only, writes nothing)
        if: github.event_name == 'workflow_dispatch' && (inputs.action == 'migrate-dry-run' || inputs.action == 'migrate')
        env:
          FIREBASE_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          DRY: ${{ inputs.action == 'migrate-dry-run' && '--dry-run' || '' }}
        run: |
          [ -n "$MONGODB_URI" ] || { echo "::error::Add the repository SECRET MONGODB_URI"; exit 1; }
          cd backend && npm ci
          set -o pipefail
          node scripts/migrateMongoToFirestore.js $DRY 2>&1 | tee /tmp/migrate.log || {
            tail -n 25 /tmp/migrate.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > /tmp/tail.txt
            echo "::error title=Migration failed::$(cat /tmp/tail.txt)"
            exit 1
          }
          tail -n 25 /tmp/migrate.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > /tmp/tail.txt
          echo "::warning title=Migration summary::$(cat /tmp/tail.txt)"

      - name: Connect custom domain
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'connect-domain'
        env:
          DOMAIN: ${{ vars.CUSTOM_DOMAIN || 'villagecrunch.in' }}
        run: ./scripts/connect-domain.sh

      - name: Load starter products
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'seed-products'
        env:
          FIREBASE_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
        run: |
          cd backend && npm ci --omit=dev
          node scripts/seedProducts.js

      - name: Create admin
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'create-admin'
        env:
          FIREBASE_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          cd backend && npm ci --omit=dev
          node scripts/createAdmin.js "${{ secrets.ADMIN_EMAIL }}" "Admin" "${{ vars.ADMIN_PHONE || '9000000000' }}"
