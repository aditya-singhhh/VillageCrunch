name: Deploy to Firebase
# Deploys Cloud Run + Hosting on push to main, using keyless auth (Workload Identity Federation).
# Setup: docs/FIREBASE_DEPLOYMENT.md, section "CI/CD".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-firebase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run backend tests
        run: cd backend && npm ci && npm test
      - name: Deploy
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          SITE_URL: ${{ vars.SITE_URL }}
          TRUST_PROXY: ${{ vars.TRUST_PROXY }}
        run: ./scripts/deploy-firebase.sh
